[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probunet-consensus-selection"
version = "0.1.0"
description = "Probabilistic U-Net reimplementation with a post-hoc consensus selection head"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "tensorboard>=2.16",
]

[project.scripts]
probunet-split = "probunet.data.splits:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working from a bare checkout even before `pip install -e .`.
pythonpath = ["src"]