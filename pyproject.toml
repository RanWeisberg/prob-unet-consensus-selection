[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probunet-consensus-selection"
version = "0.1.0"
description = "Probabilistic U-Net reimplementation with a post-hoc consensus selection head"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    # Required at runtime: training logs to TensorBoard, configs are YAML,
    # and Hungarian matching in evaluation uses scipy.optimize.
    "tensorboard>=2.16",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# The package never plots; only notebooks/submission.ipynb does. Colab ships
# matplotlib preinstalled, so this extra is only needed for a local notebook run.
notebook = [
    "matplotlib>=3.8",
]

[project.scripts]
# scripts/ is not a package, so train.py is run directly: python scripts/train.py
probunet-split = "probunet.data.splits:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps `pytest` working from a bare checkout even before `pip install -e .`.
pythonpath = ["src"]
markers = [
    "version_sensitive: pins bitwise loss/latent values, so it depends on the exact NumPy and torch build and will fail on a different one. Deselect with -m 'not version_sensitive' when running the suite somewhere the build is not controlled, e.g. inside the submission notebook on Colab.",
]