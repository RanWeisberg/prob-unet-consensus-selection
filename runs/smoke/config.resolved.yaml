run:
  name: smoke
  seed: 2018
  device: auto
  out_dir: runs
  deterministic: true
model:
  latent_dim: 6
  base_channels: 32
  num_downs: 4
  convs_per_scale: 3
  num_classes: 2
  image_channels: 1
  mask_channels: 1
  fcomb_convs: 3
  fcomb_channels: null
  max_channels: null
  align_corners: false
  bias_init_std: 0.001
loss:
  beta: 1.0
data:
  npz_path: data/processed/lidc.npz
  split_path: data/splits/split.json
  batch_size: 4
  num_workers: 0
  pin_memory: false
  pairing_seed: 2018
  normalization: none
  augment: false
  validate_on_load: true
  drop_last: false
optim:
  name: adam
  lr: 0.0001
  weight_decay: 1.0e-05
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
schedule:
  name: constant
  milestones: []
  values: []
train:
  epochs: 2
  amp: false
  grad_clip: null
  val_every_n_epochs: 1
  limit_train_batches: 5
  limit_val_batches: 2
log:
  tensorboard: true
  log_every_n_steps: 1
  diagnostics_every_n_epochs: 1
  prior_samples_for_ce: 2
  diversity_samples: 4
  diversity_images: 8
  panel_images: 4
  panel_samples: 3
checkpoint:
  save_best: true
  save_last: true
  monitor: val/total
  mode: min
