# Modernized variant (Phase 2): a FULL-COVARIANCE latent Gaussian. Live, not a scaffold.
#
# Phase 2 is EXACTLY ONE FLAG: `model.latent_covariance: full`. That is the single line
# below that differs from configs/baseline.yaml. Diff the two files; if more than one line
# comes back, the comparison has been confounded and the change is a mistake.
#
# What the flag does. The paper's prior and posterior both emit an axis-aligned (diagonal)
# Gaussian, forcing the N latent dimensions to be mutually independent. With `full` they
# emit N + N(N+1)/2 numbers instead of 2N (27 instead of 12 at N=6), packed into a
# lower-triangular Cholesky factor L whose diagonal is exp(0.5*logvar) -- exactly the
# sigmas the diagonal path produces. The covariance is Sigma = L L^T, positive-definite by
# construction. Parameter count and step time are effectively unchanged, so this arm costs
# the same wall-clock as the baseline.
#
# Why this and not something else. Our own measurement, not a borrowed citation: the Phase 1
# run put 98.8% of the latent KL into ONE of six dimensions from epoch 10 onward
# (FINDINGS 2.3). A diagonal covariance makes the KL a sum of independent per-axis
# penalties, so the cheapest solution is to funnel everything into one axis -- which is what
# happened. A full covariance removes the axis-alignment constraint. Prediction, registered
# before the run: effective latent dimensionality rises (FINDINGS 3.2).
#
# NOTHING ELSE JOINS PHASE 2. An earlier draft of this header listed Dice/focal loss,
# GroupNorm and KL annealing as co-arriving flags. CLAUDE.md REJECTED all three, and they
# are not coming: they change the objective in ways that break the ELBO's log-likelihood
# interpretation and may themselves suppress diversity, and a second improvement would
# confound the one number this arm exists to produce. They live in the report as
# considered-and-rejected. Augmentation is likewise NOT a candidate -- it is the paper's own
# method (Appendix H.1) and belongs to Phase 1; claiming it here would misattribute the
# authors' work to us. Latent dimension stays at N=6 for the same reason.
#
# The variant is the SAME model class as the baseline with one config value changed. There
# is no separate model implementation and there must never be one: duplicated code drifts,
# and a drifted copy invalidates the claim that a comparison isolates a single variable.
#
# Flag-off is bit-identical to Phase 1 by construction -- the diagonal case takes the
# Independent(Normal) path unchanged rather than a MultivariateNormal with a diagonal factor
# -- and tests/test_variants.py asserts both halves: that flag-off reproduces the baseline
# exactly, and that this file really does set the flag to `full`.
#
# Everything else below is identical to configs/baseline.yaml.

run:
  name: modernized
  seed: 2018
  device: auto
  out_dir: runs
  deterministic: true

model:
  latent_dim: 6         # HELD at 6. Bhat et al. tuned the latent dimension per model and
                        # found 2 best for their full-covariance variant; changing the
                        # covariance AND the dimension would confound two variables. A
                        # latent-dimension sweep is a legitimate SEPARATE ablation.

  # >>> THE ONE LINE THAT MAKES THIS PHASE 2 <<<
  # baseline.yaml has `diagonal` here. This is the only difference between the two configs
  # and therefore the only variable the headline comparison changes.
  latent_covariance: full

  base_channels: 32
  num_downs: 4
  convs_per_scale: 3
  num_classes: 2
  image_channels: 1
  mask_channels: 1
  fcomb_convs: 3
  fcomb_channels: null
  max_channels: null      # still the paper's schedule; capping is not a variant
  align_corners: false
  bias_init_std: 0.001

loss:
  beta: 1.0

data:
  npz_path: data/processed/lidc.npz
  split_path: data/splits/split.json
  batch_size: 32
  num_workers: 0
  pin_memory: false
  normalization: none     # PHASE 2 candidate; raises today if changed

  # MUST match configs/baseline.yaml. Augmentation is the PAPER'S technique and is part
  # of the Phase 1 baseline, so it is NOT a Phase 2 candidate and must not be toggled
  # here -- doing so would confound the modernization comparison with the augmentation
  # ablation. Keep this block byte-identical to baseline.yaml.
  augmentation:
    enabled: true
    seed: 5034
    pad_to_px: 180
    random_crop: true
    rotation_degrees: 22.5
    scale_range: [0.8, 1.2]
    shear: 0.1
    elastic_alpha_px: 5.0
    elastic_sigma_px: 10.0
    max_redraws: 3

optim:
  name: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8

schedule:
  # Identical to baseline.yaml: the paper's five-step decay. Same reason as the data
  # block -- the schedule is part of the baseline, not a Phase 2 variable.
  name: piecewise
  milestones: [0.1666667, 0.3333333, 0.5, 0.6666667, 0.8333333]
  values: [1.0e-4, 3.9810717e-5, 1.5848932e-5, 6.3095734e-6, 2.5118864e-6, 1.0e-6]

train:
  mode: elbo
  iterations: 240000      # same budget as baseline, or the comparison is confounded
  epochs: null
  amp: false
  grad_clip: null
  val_every_n_epochs: 1
  limit_train_batches: null
  limit_val_batches: null

log:
  tensorboard: true
  log_every_n_steps: 20
  diagnostics_every_n_epochs: 25
  prior_samples_for_ce: 4
  diversity_samples: 16
  diversity_images: 64
  panel_images: 8
  panel_samples: 6

checkpoint:
  save_best: true
  save_last: true
  monitor: val/total
  mode: min
