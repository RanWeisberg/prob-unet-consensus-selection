# PHASE 1 -- faithful reproduction of the Probabilistic U-Net
# (Kohl et al., NeurIPS 2018, arXiv:1806.05034) on preprocessed LIDC-IDRI.
#
# Everything Appendix H.1 specifies is reproduced here: the architecture, the
# augmentation, the 240k-iteration budget and the five-step learning-rate decay.
# Augmentation is the PAPER'S OWN technique, so it belongs in Phase 1 -- reintroducing
# it later as a "modernization" would credit their work to us.
#
# NO modernization and NO extension settings appear here. Those are separate,
# flag-gated phases with their own configs, so that every comparison isolates
# exactly one variable.
#
# This is a MULTI-DAY RUN. The startup banner prints a measured wall-clock estimate,
# and --resume restores optimizer, scheduler, step count, RNG and history, so an
# interruption costs at most one epoch.

run:
  name: baseline
  seed: 2018            # also the data pairing seed; the SPLIT seed is frozen at 1806
  device: auto          # cuda -> mps -> cpu, logged at startup
  out_dir: runs
  deterministic: true

model:
  latent_dim: 6         # N = 6, Appendix H.1
  base_channels: 32
  num_downs: 4          # 4 down- and 4 up-sampling operations
  convs_per_scale: 3    # three 3x3 convs per scale, each followed by ReLU
  num_classes: 2        # binary segmentation with softmax cross-entropy
  image_channels: 1
  mask_channels: 1      # posterior input is image + one 0/1 mask channel
  fcomb_convs: 3        # three successive 1x1 convolutions
  fcomb_channels: null  # null -> base_channels, as in the authors' released code

  # PAPER: strict channel doubling, [32, 64, 128, 256, 512] over 4 down-samplings.
  # THIS IS THE BASELINE and it must stay null. A non-null value CAPS channel growth
  # -- a memory optimization from the authors' released code, not the paper -- which
  # cuts the model from 27,499,098 to 5,513,946 parameters at max_channels=128.
  # Any capped run is a DIFFERENT configuration and its numbers are not comparable
  # to baseline numbers. Label it as such in the report. See DEVIATIONS.md entry 3.
  max_channels: null

  align_corners: false  # reference uses true; see DEVIATIONS.md entry 4
  bias_init_std: 0.001  # truncated normal, truncated at +-2 sigma

loss:
  beta: 1.0             # paper value. Meaningful ONLY under the reduction convention
                        # in src/probunet/losses/elbo.py: CE summed over pixels and
                        # meaned over batch, KL summed over latent dims and meaned
                        # over batch. Do not change either reduction.

data:
  npz_path: data/processed/lidc.npz
  split_path: data/splits/split.json
  batch_size: 32        # Appendix H.1
  num_workers: 0        # arrays are already resident; spawn platforms would copy ~1.9 GiB per worker
  pin_memory: false     # CUDA-only optimization; set true on the RTX 3070 if it helps
  normalization: none   # images are already in [0, 1]; the paper specifies none

  # Appendix H.1, verbatim: "We apply augmentations to the image tiles (180x180 pixels
  # size): random elastic deformation, rotation, shearing, scaling and a randomly
  # translated crop that results in a tile size of 128x128 pixels."
  #
  # The paper gives the transform TYPES but NOT ONE numeric value. Provenance of each
  # setting below is recorded in DEVIATIONS.md entry 6 and in data/transforms.py.
  #
  # Note what is absent: no mirroring, no gamma/intensity. Both appear in the authors'
  # released code, but only in its CITYSCAPES loader -- there is no LIDC loader in that
  # repository -- and the paper says Cityscapes "additionally impose random color
  # augmentations". Adding either would make Phase 1 harsher than the paper.
  augmentation:
    enabled: true
    seed: 5034          # distinct from split (1806) and pairing (2018) seeds

    # THE KEY SETTING. Our data is pre-cropped to 128x128, so there is no 180x180 tile
    # to crop from. Applying the paper's magnitudes to a bare 128 frame is NOT faithful,
    # it is harsher: the paper's 52px margin is exactly what absorbs them. Rotating a
    # bare 128 tile by 22.5 deg fills 13.97% of the frame with border, and scale 0.8
    # fills 36.50%; at 180 both are artifact-free (137.8px and 144.0px respectively).
    # So we reflect-pad 128 -> 180, transform in that frame, and take the paper's
    # randomly translated 128 crop back out. Cost: the outer ring is mirrored tissue
    # rather than real CT. See DEVIATIONS.md entry 12.
    pad_to_px: 180
    random_crop: true

    rotation_degrees: 22.5    # reference da_kwargs angle_x = +-pi/8; resolution-independent
    scale_range: [0.8, 1.2]   # reference da_kwargs scale; resolution-independent
    shear: 0.1                # OURS: absent from the paper AND from batchgenerators
    elastic_alpha_px: 5.0     # OURS: peak displacement in px. The reference's (0, 800)
    elastic_sigma_px: 10.0    # normalizes by an L2 norm that scales with array size, so
                              # it does not transfer from 256x512 to 128x128.
    max_redraws: 3            # a transform that empties a non-empty mask is redrawn;
                              # watch train/aug_lesion_lost_fraction in TensorBoard

optim:
  name: adam            # plain Adam, NOT AdamW. The reference applies L2 as
  lr: 1.0e-4            # 1e-5 * sum(w^2)/2 over weights AND biases, which
  weight_decay: 1.0e-5  # torch.optim.Adam(weight_decay=1e-5) reproduces exactly.
  betas: [0.9, 0.999]
  eps: 1.0e-8

schedule:
  # The paper's schedule: "an initial learning rate of 1e-4 that is lowered to 1e-6 in
  # 5 steps" (Appendix H.1). Read as FIVE lowering events, hence six levels, spaced
  # geometrically (ratio 10^(-2/5) = 0.3981 per step) over equal-length plateaus.
  #
  # The paper fixes only the two endpoints and the number of steps. The intermediate
  # VALUES and the milestone POSITIONS are ours: the authors' released schedule is a
  # Cityscapes one (values [1e-4, 0.5e-4, 1e-5, 0.5e-6] at boundaries [80k, 160k, 240k])
  # and is neither five steps nor bounded below by 1e-6. A geometric ladder is the
  # choice that injects no arbitrary round numbers. See DEVIATIONS.md entry 6.
  #
  # Milestones are FRACTIONS of total steps, so the schedule keeps its shape at any
  # budget rather than hardcoding boundaries tuned for one.
  name: piecewise
  milestones: [0.1666667, 0.3333333, 0.5, 0.6666667, 0.8333333]
  values: [1.0e-4, 3.9810717e-5, 1.5848932e-5, 6.3095734e-6, 2.5118864e-6, 1.0e-6]

train:
  # The paper's budget, expressed in ITERATIONS as the paper states it (Appendix H.1:
  # 240k iterations at batch 32). The epoch count is DERIVED from the train split size
  # rather than hardcoded -- 9,056 patches / batch 32 = 283 steps/epoch, so 240,000
  # rounds to the nearest whole epoch at 848 epochs = 239,984 steps (16 short, 0.007%).
  # Change the split or the batch size and the epoch count follows automatically.
  iterations: 240000
  epochs: null          # exactly one of iterations/epochs may be set
  amp: false            # CUDA only; raises on MPS/CPU rather than silently no-op
  grad_clip: null

  # Kept at 1. At this budget validation costs ~16 s against a ~120 s epoch: about 13%
  # of the run, or ~3.8 h of ~33 h. That buys a fine-grained overfitting signal and the
  # largest possible candidate set for checkpoint selection. The genuinely expensive
  # cadence at 848 epochs is log.diagnostics_every_n_epochs, which is why THAT was
  # relaxed below rather than this.
  val_every_n_epochs: 1
  limit_train_batches: null
  limit_val_batches: null

log:
  tensorboard: true
  log_every_n_steps: 20
  # The latent diagnostics matter more than the loss curve: with KL at ~0.0006% of
  # the objective the risk is an unconstrained latent whose prior never covers the
  # grader variants, which the training loss cannot show.
  #
  # Relaxed 5 -> 25 for the paper's budget. At 848 epochs a cadence of 5 means 170 runs
  # of the expensive diagnostics (16 prior samples over 64 images, plus a panel); 25
  # gives ~34 sampling points, which is ample resolution for a curve that spans days.
  # This touches no checkpoint-selection semantics.
  diagnostics_every_n_epochs: 25
  prior_samples_for_ce: 4
  diversity_samples: 16
  diversity_images: 64  # fixed, stratified across ambiguity buckets
  panel_images: 8       # fixed, stratified; indices recorded to diagnostic_indices.json
  panel_samples: 6

checkpoint:
  save_best: true
  save_last: true
  monitor: val/total    # NEVER a test metric. One public reimplementation selects on
  mode: min             # test and that biases every number it reports.
