# Extension variant (Phase 3): the consensus-selection head. LIVE.
#
# train.mode = selection_head trains the head on top of an already-trained, FROZEN
# Probabilistic U-Net: draw prior candidates, score each against the soft consensus of the
# four graders, and regress the head's prediction onto that score.
#
#   python scripts/train.py --config configs/extension.yaml \
#       --base-checkpoint runs/baseline/checkpoints/best.pt
#
# The base must be frozen because the claim is "distribution metrics unchanged,
# single-sample quality improved". A base that kept training would change GED too, and
# the result would look like the extension working when it was just more training.
#
# WHICH BASE -- CHANGED, and the reason is on record. CLAUDE.md originally specified the
# MODERNIZED (Phase 2) model. The reported head run uses the **Phase 1 baseline** instead,
# because Phase 1 is the checkpoint whose consensus headroom was actually measured:
# aggregate 0.2895, random 0.2349 -> oracle 0.5244 (FINDINGS 4.4). Fitting the head to a
# base whose headroom is known is what makes "the head captured X% of the gap" a statement
# about the head rather than about an unmeasured base.
#
# There is a second reason, from FINDINGS 2.11: Phase 2 SHARPENED the sample distribution
# rather than broadening it, and its per-bucket GED regressed on over half the dataset
# (2.12). A selection head has less to select between on a more concentrated sample set, so
# the Phase 1 base is also the more informative one to demonstrate the head on.
#
# Head-on-Phase2 becomes a LATER ABLATION, run with identical settings and compared through
# scripts/compare.py, which REFUSES mismatched arms (probunet/extension/ablation.py).
#
# BEFORE THE REAL RUN, on the training machine:
#   python scripts/head_smoke_gate.py --base-checkpoint runs/baseline/checkpoints/best.pt
#
# SCORING TARGET -- DECIDED (2026-08-06): SOFT CONSENSUS.
#   c = (1/4) * sum_k m_k, each pixel in {0, 0.25, 0.5, 0.75, 1.0} = the fraction of
#   graders who included it. A candidate is scored by soft Dice against c and the head
#   REGRESSES onto that score. Full rationale, the failure arithmetic that rules out the
#   per-grader aggregates, and the STAPLE rejection are in FINDINGS 4.4.
#
#   Consensus is the SELECTION target ONLY. GED, diversity and every other distribution
#   metric keep using the four SEPARATE grader masks -- averaging them there would
#   discard exactly the grader spread Phase 1 measures.
#
#   Scores are bounded well below 1 by construction: a perfect mask on a 3-empty image
#   scores 0.40. Per-bucket ceilings 0.40 / 0.667 / 0.857 / 1.00. Never report against 1.0.
#
# The head trains on PRIOR samples. Posterior samples are almost always good, so a head
# trained only on those never sees a bad mask and learns a constant high score.
#
# HEAD HYPERPARAMETERS are in the `head:` block below, each with its reasoning.
#
# Two that are not config values and must not drift:
#   - The head is deliberately NOT given mask summary statistics such as area. Pooling
#     recovers area implicitly, and handing it over explicitly makes the size-prior
#     shortcut easier to learn. A mask-area-only regressor is kept as a DIAGNOSTIC: if the
#     head barely beats it, the head learned size priors, not spatial agreement.
#   - Binarization reuses diagnostics.logits_to_mask (argmax over the class axis), the same
#     convention Phase 1 evaluation already uses -- the head consumes exactly the artifact
#     that gets scored and delivered. Soft-probability input is a possible ablation.
#
# The scorer output is LINEAR and unbounded. Not sigmoid: targets cluster near zero, which
# is where sigmoid's inverse is steepest, so it would drive pre-activations far negative
# and saturate. The score is only ever argmax'd within an image, so values outside [0, 1]
# are cosmetic -- clamp for DISPLAY only, never before the loss.
#
# The model block must match the base checkpoint's architecture exactly, or the weights
# will not load. It is repeated here rather than inherited so a mismatch is visible.

run:
  name: extension
  seed: 2018
  device: auto
  out_dir: runs
  deterministic: true

model:
  latent_dim: 6
  base_channels: 32
  num_downs: 4
  convs_per_scale: 3
  num_classes: 2
  image_channels: 1
  mask_channels: 1
  fcomb_convs: 3
  fcomb_channels: null
  max_channels: null
  align_corners: false
  bias_init_std: 0.001

loss:
  beta: 1.0               # unused in selection_head mode; the head has its own objective

head:
  # Prior candidates per image per TRAINING step. Sampling re-runs only f_comb with the
  # base under no_grad, so 8 candidates cost 8 passes of a 1x1-conv stack, not 8 U-Nets.
  train_samples: 8
  # Candidates at VALIDATION -- 16, so the numbers sit beside the Phase 1 table. Train-K
  # need not equal eval-K because the head scores each candidate INDEPENDENTLY, which is a
  # genuine advantage of the regression formulation and worth a sentence in the report.
  # Both are FIXED once: head-on-Phase1 vs head-on-Phase2 requires identical runs. If
  # 8 GiB OOMs, reduce data.batch_size, NOT these, and record it.
  eval_samples: 16
  # Huber, not MSE and not L1. delta is set at the scale of WITHIN-IMAGE score
  # differences, so the differences the head must actually discriminate sit in the
  # quadratic region while cross-bucket errors get linear treatment. MSE would
  # over-weight the few high-target bucket-4 images given a target distribution that is
  # bounded and bucket-1-heavy near zero; L1's constant gradient near zero jitters at
  # convergence.
  huber_delta: 0.1
  scorer_channels: [32, 64, 128]
  # PRE-REGISTERED FALLBACK, off by default (FINDINGS 4.4). Achievable scores are strongly
  # bucket-dependent, so plain regression can score well by predicting each image's typical
  # value while ignoring the candidate. If val Spearman sits near zero while the Huber loss
  # looks healthy, switch this on -- targets are then centered within each image, removing
  # the between-image component the shortcut exploits. Recorded in advance so that taking
  # it later is a planned contingency, not an unexplained pivot.
  mean_centered_targets: false

data:
  npz_path: data/processed/lidc.npz
  split_path: data/splits/split.json
  batch_size: 32
  num_workers: 0
  pin_memory: false
  normalization: none

  # AUGMENTATION IS OFF FOR THE HEAD, deliberately. See DEVIATIONS.md entry 13.
  #
  #   (a) The base is FROZEN, so augmentation's Phase 1 purpose -- regularizing a 27.5M
  #       parameter generative model -- does not apply. It would only regularize a ~150k
  #       parameter head that already sees freshly resampled candidates every epoch, so
  #       the head's data is not scarce.
  #   (b) There is no augmentation at inference. Training the head on elastically
  #       deformed images hands a frozen base a domain shift for zero benefit.
  #   (c) Extending the shared augmentation path to transform four masks under one
  #       sampled transform would touch code Phase 1 and Phase 2 both depend on. The risk
  #       to comparability is not worth it.
  #
  # Consequence: the head's training data uses the EVAL-mode four-mask path with
  # augmentation off -- the existing evaluation dataset shape, used for training. There
  # is no third dataset mode. This is also enforced from the other side: constructing an
  # augmented eval dataset raises (tests/test_data.py), so an eval-mode dataset carrying
  # four masks cannot be augmented even by accident.
  augmentation:
    enabled: false
    seed: 5034
    pad_to_px: 180
    random_crop: true
    rotation_degrees: 22.5
    scale_range: [0.8, 1.2]
    shear: 0.1
    elastic_alpha_px: 5.0
    elastic_sigma_px: 10.0
    max_redraws: 3

optim:
  name: adam
  # 1e-3, not the baseline's 1e-4: that rate was tuned for a 27.5M-parameter model over
  # 240k steps. A small regression head on a frozen backbone converges far faster, and
  # 1e-3 is the standard default for such heads. The smoke test must confirm the loss
  # decreases; if it is unstable, fall back to 3e-4 and RECORD that.
  lr: 1.0e-3
  # 0, not 1e-5: candidates are resampled every epoch, so there is no overfitting
  # pressure worth regularizing.
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

schedule:
  name: constant
  milestones: []
  values: []

train:
  mode: selection_head    # requires --base-checkpoint
  # 30 epochs, justified EMPIRICALLY rather than a priori: the validation curve is the
  # evidence. If the monitored metric is still climbing at 30, extend and say so. If it
  # plateaus by 15, report that too -- it is a legitimate finding about how little
  # capacity this task needs.
  epochs: 30
  iterations: null        # an epoch count is the natural unit for the head
  amp: false
  grad_clip: null
  val_every_n_epochs: 1
  limit_train_batches: null
  limit_val_batches: null

log:
  tensorboard: true
  log_every_n_steps: 20
  diagnostics_every_n_epochs: 5
  prior_samples_for_ce: 4
  diversity_samples: 16
  diversity_images: 64
  panel_images: 8
  panel_samples: 6

checkpoint:
  save_best: true
  save_last: true
  # The DELIVERABLE itself: mean consensus soft-Dice of the HEAD-SELECTED sample.
  # Deliberately not a proxy -- a constant predictor cannot game it, because a constant
  # score degenerates to a fixed arbitrary pick and scores about the same as random
  # selection. val Spearman and val Huber loss are also logged, for diagnosis, but the
  # thing being optimized is the thing being reported.
  #
  # NOT val/total: with a frozen base the ELBO is constant, so selecting on it would be
  # selecting on a flat curve. In selection_head mode val/total is not computed at all.
  monitor: val/selected_consensus_dice
  mode: max
