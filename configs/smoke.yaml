# Smoke test: exercise the entire training loop end to end in well under a minute.
#
# Same code paths as configs/baseline.yaml, including validation over all four
# graders, checkpointing and every diagnostic, on a handful of batches. Run this
# before any long run -- it catches the whole class of "crashed at epoch 40 in the
# diagnostics" failures for the price of a few seconds.
#
#     python scripts/train.py --config configs/smoke.yaml
#
# It uses the REAL dataset (a synthetic stand-in would not test the real data path),
# so it pays ~5 s to load the npz. The model is the real architecture; only the
# number of batches is small.

run:
  name: smoke
  seed: 2018
  device: auto
  out_dir: runs
  deterministic: true

model:
  latent_dim: 6
  base_channels: 32
  num_downs: 4
  convs_per_scale: 3
  num_classes: 2
  max_channels: null      # still the paper's schedule: the smoke run tests the real model

loss:
  beta: 1.0

data:
  npz_path: data/processed/lidc.npz
  split_path: data/splits/split.json
  batch_size: 4
  num_workers: 0
  normalization: none
  augmentation:
    enabled: false      # deliberately OFF: the smoke run must stay a fast check of the
                        # loop's plumbing. tests/test_transforms.py covers augmentation.

optim:
  name: adam
  lr: 1.0e-4
  weight_decay: 1.0e-5

schedule:
  name: constant

train:
  epochs: 2             # an epoch count, not an iteration budget, is the natural unit here
  iterations: null
  amp: false
  val_every_n_epochs: 1
  limit_train_batches: 5    # 5 steps per epoch
  limit_val_batches: 2

log:
  tensorboard: true
  log_every_n_steps: 1
  diagnostics_every_n_epochs: 1   # every diagnostic path runs every epoch
  prior_samples_for_ce: 2
  diversity_samples: 4
  diversity_images: 8
  panel_images: 4
  panel_samples: 3

checkpoint:
  save_best: true
  save_last: true
  monitor: val/total
  mode: min
